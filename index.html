<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FlipFocus — 手机翻转检测工具</title>
<style>
  :root {
    --bg: #F5F6FA;
    --card: #FFFFFF;
    --accent: #3366FF;
    --green: #22AA55;
    --red: #E04444;
    --orange: #E08830;
    --text: #1A1D28;
    --muted: #9095A5;
    --border: #DDE0E8;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  .screen { display:none; padding: 24px 20px 100px; max-width: 480px; margin:0 auto; }
  .screen.active { display:block; }

  /* ── Common ── */
  .title { font-size: 32px; font-weight: 800; color: var(--accent); text-align: center; letter-spacing: 2px; }
  .subtitle { font-size: 13px; color: var(--muted); text-align: center; margin: 4px 0 24px; }
  .card {
    background: var(--card); border-radius: 16px; padding: 16px;
    margin-bottom: 12px; border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .label { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .chip {
    padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--bg); color: var(--muted); font-size: 14px;
    font-weight: 600; cursor: pointer; transition: all .15s;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cond-btn {
    display:block; width:100%; padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--muted);
    font-size: 14px; text-align: left; margin-bottom: 6px; cursor: pointer;
    transition: all .15s;
  }
  .cond-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .btn {
    display:block; width:100%; padding: 16px; border-radius: 16px;
    font-size: 16px; font-weight: 800; text-align: center; cursor: pointer;
    border: none; margin-top: 12px; transition: all .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); font-weight: 400; margin-top: 8px; }

  /* ── Bottom Nav ── */
  .bottom-nav {
    position:fixed; bottom:0; left:0; right:0; background: var(--card);
    border-top: 1px solid var(--border); display:flex; padding: 8px 16px;
    padding-bottom: max(8px, env(safe-area-inset-bottom)); z-index: 100;
  }
  .nav-item {
    flex:1; text-align:center; padding: 8px 4px; border-radius: 10px;
    cursor: pointer; transition: all .15s; color: var(--muted); font-size: 12px;
  }
  .nav-item.active { color: var(--accent); }
  .nav-icon { font-size: 20px; display:block; margin-bottom: 2px; }

  /* ── Session ── */
  .status-badge {
    display:inline-block; padding: 8px 20px; border-radius: 24px;
    font-size: 14px; font-weight: 700; text-align: center; margin: 0 auto 12px;
  }
  .status-up { background: #FFF0F0; border: 1px solid var(--red); color: var(--text); }
  .status-down { background: #E8F8EE; border: 1px solid var(--green); color: var(--text); }
  .badge-wrap { text-align: center; }
  .timer { font-size: 64px; font-weight: 900; text-align: center; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
  .progress-wrap { height:4px; background:var(--border); border-radius:2px; margin:8px 0 12px; overflow:hidden; }
  .progress-fill { height:100%; background:var(--accent); border-radius:2px; transition: width 1s linear; }
  .info-row { display:flex; justify-content:space-around; margin-bottom:12px; }
  .info-row span { color:var(--muted); font-size:13px; }
  .sensor-grid { display:grid; grid-template-columns: repeat(3,1fr); gap:12px; text-align:center; }
  .sensor-val { font-size: 20px; font-weight: 700; margin-top:4px; }
  .sensor-val.on { color: var(--green); }
  .stats-grid { display:grid; grid-template-columns: repeat(3,1fr); gap:12px; text-align:center; }
  .stat-num { font-size: 22px; font-weight: 800; color: var(--accent); }
  .stat-label { font-size: 10px; color: var(--muted); margin-top:2px; }
  .btn-green { background: var(--green); color: #fff; }

  /* ── Permission ── */
  .perm-box {
    background: var(--card); border: 2px solid var(--accent); border-radius: 16px;
    padding: 24px; text-align: center; margin-bottom: 16px;
  }
  .perm-box h3 { margin-bottom: 8px; }
  .perm-box p { color: var(--muted); font-size: 13px; margin-bottom: 16px; line-height: 1.5; }

  /* ── Guide ── */
  .guide .step-num {
    display:inline-block; width:28px; height:28px; border-radius:14px;
    background: var(--accent); color: #fff; text-align: center; line-height: 28px;
    font-size: 14px; font-weight: 800; margin-right: 10px; flex-shrink: 0;
  }
  .guide .step-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .guide .step-desc { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .guide .step-desc strong { color: var(--text); }
  .guide .highlight { background: #E8F8EE; border: 1px solid var(--green); }
  .guide .highlight-red { background: #FFF0F0; border: 1px solid var(--red); }
  .guide .highlight-orange { background: #FFF6EC; border: 1px solid var(--orange); }
  table.guide-tbl { width:100%; border-collapse:collapse; font-size:12px; margin:8px 0; }
  table.guide-tbl th { color: var(--muted); font-weight:600; text-align:left; padding:4px 8px; border-bottom:1px solid var(--border); font-size:10px; text-transform:uppercase; letter-spacing:1px; }
  table.guide-tbl td { padding:6px 8px; border-bottom:1px solid var(--border); color: var(--text); vertical-align:top; }
  table.guide-tbl td.cond-a { color: #157A3A; font-weight:700; }
  table.guide-tbl td.cond-d { color: #B87020; font-weight:700; }

  /* ── Toast ── */
  .toast {
    position:fixed; top:16px; left:16px; right:16px;
    padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
    text-align: center; z-index: 999; display:none;
  }
  .toast.ok { background: #E8F8EE; color: #157A3A; border: 1px solid var(--green); }
  .toast.warn { background: #FFF6EC; color: #B87020; border: 1px solid var(--orange); }

  /* ── Checklist ── */
  .cl-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); cursor:pointer; }
  .cl-box { width:22px; height:22px; border-radius:6px; border:2px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .2s; }
  .cl-box.done { background: var(--green); border-color: var(--green); }
  .cl-box.done::after { content:'✓'; color:#000; font-weight:800; font-size:14px; }
  .cl-text { font-size:13px; color: var(--text); }
  .cl-text.done { color: var(--muted); text-decoration:line-through; }

  /* ── Language toggle ── */
  #langBtn {
    position:fixed; top:12px; right:12px; z-index:200;
    padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--card); color: var(--accent); font-size: 12px; font-weight: 700;
    cursor: pointer; font-family: inherit; box-shadow: var(--shadow);
    -webkit-tap-highlight-color: transparent;
  }
  #langBtn:active { transform: scale(0.96); }
</style>
</head>
<body>

<button id="langBtn" onclick="toggleLang()">EN</button>

<!-- ═══ Toast ═══ -->
<div id="toast" class="toast"></div>

<!-- ═══ Screen 0: Permission Request (iOS) ═══ -->
<div id="screen-perm" class="screen active">
  <div style="padding-top:60px">
    <div class="title">FlipFocus</div>
    <div class="subtitle" data-i18n="perm.subtitle"></div>
    <div class="perm-box">
      <h3 data-i18n="perm.h3"></h3>
      <p data-i18n="perm.body"></p>
      <p style="color:#157A3A;font-size:12px" data-i18n="perm.local"></p>
      <button class="btn btn-primary" onclick="requestPermission()" data-i18n="perm.btn"></button>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════════════ -->
<!-- Screen 1: 使用说明 (Guide)                          -->
<!-- ════════════════════════════════════════════════════ -->
<div id="screen-guide" class="screen guide">
  <div class="title">FlipFocus</div>
  <div class="subtitle" data-i18n="guide.subtitle"></div>

  <!-- 这是什么 -->
  <div class="card highlight">
    <div class="step-desc" style="color:var(--text)" data-i18n="guide.what"></div>
  </div>

  <!-- 流程概览 -->
  <div class="card">
    <div style="display:flex;justify-content:space-around;text-align:center">
      <div><div style="font-size:28px">📱</div><div style="font-size:11px;color:var(--muted)" data-i18n="guide.flow1"></div></div>
      <div style="color:var(--muted)">→</div>
      <div><div style="font-size:28px">🎛️</div><div style="font-size:11px;color:var(--muted)" data-i18n="guide.flow2"></div></div>
      <div style="color:var(--muted)">→</div>
      <div><div style="font-size:28px">⏱️</div><div style="font-size:11px;color:var(--muted)" data-i18n="guide.flow3"></div></div>
      <div style="color:var(--muted)">→</div>
      <div><div style="font-size:28px">📦</div><div style="font-size:11px;color:var(--muted)" data-i18n="guide.flow4"></div></div>
    </div>
  </div>

  <!-- Step 1 -->
  <div class="card">
    <div style="display:flex;align-items:flex-start">
      <span class="step-num">1</span>
      <div>
        <div class="step-title" data-i18n="guide.s1t"></div>
        <div class="step-desc" data-i18n="guide.s1d"></div>
      </div>
    </div>
  </div>

  <!-- Step 2 -->
  <div class="card">
    <div style="display:flex;align-items:flex-start">
      <span class="step-num">2</span>
      <div>
        <div class="step-title" data-i18n="guide.s2t"></div>
        <div class="step-desc" data-i18n="guide.s2d"></div>
      </div>
    </div>
  </div>

  <!-- Step 3 -->
  <div class="card">
    <div style="display:flex;align-items:flex-start">
      <span class="step-num">3</span>
      <div>
        <div class="step-title" data-i18n="guide.s3t"></div>
        <div class="step-desc" data-i18n="guide.s3d"></div>
      </div>
    </div>
  </div>

  <!-- Step 4 -->
  <div class="card">
    <div style="display:flex;align-items:flex-start">
      <span class="step-num">4</span>
      <div>
        <div class="step-title" data-i18n="guide.s4t"></div>
        <div class="step-desc" data-i18n="guide.s4d"></div>
      </div>
    </div>
  </div>

  <!-- 机型差异 -->
  <div class="card highlight">
    <div class="step-desc" style="color:var(--text)" data-i18n="guide.degrade"></div>
  </div>
</div>

<!-- ═══ Screen 2: 采集工具 (Setup) ═══ -->
<div id="screen-setup" class="screen">
  <div class="title">FlipFocus</div>
  <div class="subtitle" data-i18n="setup.subtitle"></div>

  <div class="card">
    <div class="label" data-i18n="setup.idLabel"></div>
    <input id="subj-input" type="text" data-i18n-ph="setup.idPh"
           style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:15px">
  </div>

  <button class="btn btn-primary" onclick="startSession()" id="btn-start">开始采集（25分钟）</button>

  <div style="margin-top:12px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)">
    <input type="checkbox" id="debug-mode" onchange="toggleDebug()" style="width:16px;height:16px">
    <label for="debug-mode" data-i18n="setup.debug"></label>
  </div>

  <div class="card highlight" style="margin-top:16px">
    <div style="font-size:12px;color:#157A3A;line-height:1.6" data-i18n="setup.calib"></div>
    <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span style="font-size:12px;color:var(--muted)" data-i18n="setup.zLabel"></span>
      <input id="cfg-z" type="number" value="-0.75" step="0.05" style="width:60px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px">
      <span style="font-size:12px;color:var(--muted)" data-i18n="setup.lightLabel"></span>
      <input id="cfg-light" type="number" value="15" step="1" style="width:55px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px">
      <button onclick="updateConfig()" style="padding:6px 12px;border-radius:8px;border:1px solid var(--accent);background:var(--bg);color:var(--accent);font-size:12px;cursor:pointer" data-i18n="setup.apply"></button>
    </div>
  </div>
</div>

<!-- ═══ Screen 3: Recording ═══ -->
<div id="screen-session" class="screen">
  <div class="badge-wrap">
    <span id="badge" class="status-badge status-up">📱 面朝上</span>
  </div>

  <div class="timer" id="timer">25:00</div>
  <div class="progress-wrap"><div class="progress-fill" id="progress-bar" style="width:0%"></div></div>

  <div class="info-row">
    <span id="info-subj"></span>
  </div>

  <div class="card">
    <div class="label"><span data-i18n="session.sensorLive"></span> <span id="sensor-mode" style="font-size:10px;font-weight:400;margin-left:8px"></span></div>
    <div class="sensor-grid">
      <div>
        <div style="font-size:11px;color:var(--muted)" data-i18n="session.accZ"></div>
        <div class="sensor-val" id="s-accz">--</div>
      </div>
      <div>
        <div style="font-size:11px;color:var(--muted)" data-i18n="session.light"></div>
        <div class="sensor-val" id="s-light">--</div>
      </div>
      <div>
        <div style="font-size:11px;color:var(--muted)" data-i18n="session.faceDown"></div>
        <div class="sensor-val" id="s-face">否</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="stats-grid">
      <div><div class="stat-num" id="st-flips">0</div><div class="stat-label" data-i18n="session.stFlips"></div></div>
      <div><div class="stat-num" id="st-duration">00:00</div><div class="stat-label" data-i18n="session.stDuration"></div></div>
      <div><div class="stat-num" id="st-points">0</div><div class="stat-label" data-i18n="session.stPoints"></div></div>
    </div>
  </div>

  <div id="session-actions">
    <button class="btn btn-ghost" onclick="earlyStop()" style="border-color:var(--border)" data-i18n="session.earlyStop"></button>
  </div>
  <div id="session-done" style="display:none">
    <button class="btn btn-green" onclick="exportData()" id="btn-export" style="width:100%;padding:14px;font-size:17px;margin-bottom:12px" data-i18n="session.exportBtn"></button>
    <p style="font-size:12px;color:var(--muted);text-align:center;margin-bottom:8px" data-i18n="session.exportHint"></p>
    <button class="btn btn-ghost" onclick="resetToSetup()" style="margin-top:4px" data-i18n="session.back"></button>
  </div>
</div>

<!-- ═══ Screen 4: History ═══ -->
<div id="screen-data" class="screen">
  <div class="title" style="font-size:24px" data-i18n="data.title"></div>
  <div class="subtitle" id="data-count">0 条记录</div>
  <div id="data-list" style="max-height:50vh;overflow-y:auto"></div>
  <button class="btn btn-ghost" onclick="exportAll()" style="font-size:12px;color:var(--muted);border-color:var(--border)" data-i18n="data.exportAll"></button>
</div>

<!-- ═══ Bottom Navigation ═══ -->
<div class="bottom-nav" id="bottomNav">
  <div class="nav-item active" onclick="showScreen('screen-guide')" id="nav-guide">
    <span class="nav-icon">📋</span><span data-i18n="nav.guide"></span>
  </div>
  <div class="nav-item" onclick="showScreen('screen-setup')" id="nav-collect">
    <span class="nav-icon">📱</span><span data-i18n="nav.collect"></span>
  </div>
  <div class="nav-item" onclick="showScreen('screen-data')" id="nav-data">
    <span class="nav-icon">📂</span><span data-i18n="nav.data"></span>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// i18n
// ═══════════════════════════════════════════════════════════
const I18N = {
  zh: {

    'session.sensorLive': '传感器实时值',

    'session.stFlips': '翻转次数', 'session.stDuration': '面朝下时长', 'session.stPoints': '数据点',

let LANG = localStorage.getItem('flipfocus_lang')
        || ((navigator.language||'').toLowerCase().startsWith('zh') ? 'zh' : 'en');

function t(k, vars) {
  let s = (I18N[LANG] && I18N[LANG][k]) || I18N.zh[k] || k;
  if (vars) for (const key in vars) s = s.split('{' + key + '}').join(vars[key]);
  return s;
}

// ═══════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════
// 公开版：只保留工具与测试功能，不含研究设计与被试标识
let state = {
  subject: '',
  condition: '',
  repetition: 1,
  cfgZ: -0.75,
  cfgLight: 15,
  debugMode: false, sessionActive: false,
  elapsed: 0,
  faceDown: false,
  faceDownSince: null,
  flipConfirmTimer: null,
  totalFaceDownMs: 0,
  flipCount: 0,
  dataLog: [],
  flipEvents: [],
  sessionTimer: null,
  motionHandler: null,
  lightSensor: null,
  badgeState: 'up',      // 'up' | 'down' | 'done'
  faceDownNow: false,
  lightState: null,      // null = 未开始 · 'unavailable' · 数值
};

let permGranted = false;
let lightSensorAvailable = false;

// ═══════════════════════════════════════════════════════════
// Bottom Navigation
// ═══════════════════════════════════════════════════════════
function showScreen(id) {
  // Don't allow navigation during active session
  if (state.sessionActive && id !== 'screen-session') {
    showToast(t('toast.busy'), 'warn'); return;
  }

  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');

  // Update nav
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navMap = { 'screen-guide':'nav-guide', 'screen-setup':'nav-collect', 'screen-data':'nav-data' };
  const navId = navMap[id];
  if (navId) document.getElementById(navId).classList.add('active');

  if (id === 'screen-data') refreshDataList();
  if (id === 'screen-setup') initSetupScreen();
}

// Show/hide bottom nav
function setNavVisible(v) {
  document.getElementById('bottomNav').style.display = v ? 'flex' : 'none';
}

// ═══════════════════════════════════════════════════════════
// Permission & Init
// ═══════════════════════════════════════════════════════════
async function requestPermission() {
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    try {
      const resp = await DeviceMotionEvent.requestPermission();
      if (resp !== 'granted') { showToast(t('toast.needPerm'), 'warn'); return; }
    } catch(e) { showToast(t('toast.permFail', {msg: e.message}), 'warn'); return; }
  }
  permGranted = true;
  initSetupScreen();
  showScreen('screen-guide');
}

function initSetupScreen() {
  const el = document.getElementById('subj-input');
  if (el) el.value = state.subject;
  document.getElementById('cfg-z').value = state.cfgZ;
  document.getElementById('cfg-light').value = state.cfgLight;
}
function updateConfig() {
  state.cfgZ = parseFloat(document.getElementById('cfg-z').value) || -0.75;
  state.cfgLight = parseFloat(document.getElementById('cfg-light').value) || 15;
  showToast(t('toast.threshold', {z: state.cfgZ, lux: state.cfgLight}), 'ok');
}

// ═══════════════════════════════════════════════════════════
// Session
// ═══════════════════════════════════════════════════════════
function toggleDebug() {
  state.debugMode = document.getElementById('debug-mode').checked;
  const btn = document.getElementById('btn-start');
  const duration = state.debugMode ? 2 : 25;
  btn.textContent = t('startBtn', {min: duration, d: state.debugMode ? ' · Debug' : ''});
}

function getSessionDuration() { return state.debugMode ? 2 : 25; }

function startSession() {
  const el = document.getElementById('subj-input');
  if (el) state.subject = (el.value || '').trim() || t('defaultSubject');
  state.dataLog = [];
  state.flipEvents = [];
  state.elapsed = 0;
  const durationMin = getSessionDuration();
  // 清除旧autosave
  localStorage.removeItem('flipfocus_autosave');
  state.faceDown = false;
  state.faceDownSince = null;
  state.totalFaceDownMs = 0;
  state.flipCount = 0;
  state.sessionActive = true;
  state.badgeState = 'up';
  state.faceDownNow = false;
  state.lightState = null;
  if (state.flipConfirmTimer) clearTimeout(state.flipConfirmTimer);

  document.getElementById('info-subj').textContent = state.subject;
  updateTimerUI();
  document.getElementById('session-actions').style.display = 'block';
  document.getElementById('session-done').style.display = 'none';
  document.getElementById('badge').className = 'status-badge status-up';
  document.getElementById('badge').textContent = t('session.badgeUp');

  showScreen('screen-session');
  setNavVisible(false); // Hide nav during recording

  startMotionSensor();
  startLightSensor();

  state.sessionTimer = setInterval(() => {
    state.elapsed++;
    updateTimerUI();
    // 每60秒自动备份传感器数据到localStorage（防误关/崩溃）
    if (state.elapsed % 60 === 0) autoBackup();
    if (state.elapsed >= getSessionDuration() * 60) endSession();
  }, 1000);
}

function autoBackup() {
  try {
    const backup = {
      participant: state.subject, condition: state.condition, repetition: state.repetition,
      elapsed: state.elapsed, flipCount: state.flipCount, totalFaceDownMs: state.totalFaceDownMs,
      sensors: state.dataLog, flips: state.flipEvents,
      savedAt: new Date().toISOString(),
    };
    localStorage.setItem('flipfocus_autosave', JSON.stringify(backup));
  } catch(e) { /* localStorage 满则静默失败 */ }
}

function updateTimerUI() {
  const totalSec = getSessionDuration() * 60;
  const remaining = totalSec - state.elapsed;
  const m = Math.floor(remaining / 60).toString().padStart(2, '0');
  const s = (remaining % 60).toString().padStart(2, '0');
  document.getElementById('timer').textContent = m + ':' + s;
  document.getElementById('progress-bar').style.width = (state.elapsed / (getSessionDuration()*60) * 100) + '%';
  document.getElementById('st-flips').textContent = state.flipCount;
  document.getElementById('st-duration').textContent = formatDuration(state.totalFaceDownMs);
  document.getElementById('st-points').textContent = state.dataLog.length;
}

function formatDuration(ms) {
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
  const s = (totalSec % 60).toString().padStart(2, '0');
  return m + ':' + s;
}

// ═══════════════════════════════════════════════════════════
// Motion Sensor
// ═══════════════════════════════════════════════════════════
function startMotionSensor() {
  let lastSample = 0;
  state.motionHandler = function(event) {
    if (!state.sessionActive) return;
    const now = Date.now();
    if (now - lastSample < 90) return; // ~10Hz
    lastSample = now;

    const acc = event.accelerationIncludingGravity;
    if (!acc) return;
    const zG = (acc.z || 0) / 9.8;

    document.getElementById('s-accz').textContent = zG.toFixed(2) + 'g';
    document.getElementById('s-accz').className = 'sensor-val' + (zG < state.cfgZ ? ' on' : '');

    state.dataLog.push({ ts: now, acc_z: parseFloat(zG.toFixed(4)), light: 999, face_down: 0 });
    checkFaceDown(zG, now);
  };
  window.addEventListener('devicemotion', state.motionHandler);
}

function startLightSensor() {
  if ('AmbientLightSensor' in window) {
    try {
      state.lightSensor = new AmbientLightSensor({ frequency: 2 });
      state.lightSensor.addEventListener('reading', () => {
        if (!state.sessionActive) return;
        const lux = state.lightSensor.illuminance;
        state.lightState = lux;
        document.getElementById('s-light').textContent = Math.round(lux) + ' lux';
        document.getElementById('s-light').className = 'sensor-val' + (lux < state.cfgLight ? ' on' : '');
        if (state.dataLog.length > 0) state.dataLog[state.dataLog.length - 1].light = Math.round(lux);
        checkFaceDown(null, null);
      });
      state.lightSensor.addEventListener('error', () => {
        lightSensorAvailable = false;
        state.lightState = 'unavailable';
        document.getElementById('s-light').textContent = t('lightUnavailable');
        updateSensorModeUI();
      });
      state.lightSensor.start();
      lightSensorAvailable = true;
    } catch(e) {
      lightSensorAvailable = false;
      state.lightState = 'unavailable';
      document.getElementById('s-light').textContent = t('lightUnavailable');
    }
  } else {
    lightSensorAvailable = false;
    state.lightState = 'unavailable';
    document.getElementById('s-light').textContent = t('lightUnavailable');
  }
  updateSensorModeUI();
}

function updateSensorModeUI() {
  const el = document.getElementById('sensor-mode');
  if (el) {
    if (lightSensorAvailable) {
      el.textContent = t('modeFull');
      el.style.color = 'var(--green)';
    } else {
      el.textContent = t('modeAccelOnly');
      el.style.color = 'var(--orange)';
    }
  }
}

// ═══════════════════════════════════════════════════════════
// Flip Detection
// ═══════════════════════════════════════════════════════════
function checkFaceDown(zG, ts) {
  if (zG === null && ts === null) {
    if (state.dataLog.length === 0) return;
    const last = state.dataLog[state.dataLog.length - 1];
    zG = last.acc_z; ts = last.ts;
  }
  const lastLight = state.dataLog.length > 0 ? state.dataLog[state.dataLog.length - 1].light : 999;
  const faceDownNow = lightSensorAvailable
    ? (zG < state.cfgZ) && (lastLight < state.cfgLight)
    : (zG < state.cfgZ);

  if (state.dataLog.length > 0) state.dataLog[state.dataLog.length - 1].face_down = faceDownNow ? 1 : 0;
  state.faceDownNow = faceDownNow;
  document.getElementById('s-face').textContent = faceDownNow ? t('yes') : t('no');
  document.getElementById('s-face').className = 'sensor-val' + (faceDownNow ? ' on' : '');

  if (faceDownNow && state.faceDownSince === null) {
    state.faceDownSince = ts || Date.now();
    state.flipConfirmTimer = setTimeout(() => {
      state.faceDown = true; state.flipCount++;
      state.flipEvents.push({ type: 'FLIP_DOWN', time: new Date().toISOString(), acc_z: zG, light: lastLight });
      state.badgeState = 'down';
      document.getElementById('badge').className = 'status-badge status-down';
      document.getElementById('badge').textContent = t('session.badgeDown');
      updateTimerUI();
      if (navigator.vibrate) navigator.vibrate(100);
    }, 3000);
  } else if (!faceDownNow && state.faceDownSince !== null) {
    clearTimeout(state.flipConfirmTimer);
    const duration = (ts || Date.now()) - state.faceDownSince;
    if (duration >= 3000) {
      state.totalFaceDownMs += duration;
      state.flipEvents.push({ type: 'FLIP_UP', time: new Date().toISOString(), duration_ms: duration });
    }
    state.faceDownSince = null; state.faceDown = false;
    state.badgeState = 'up';
    document.getElementById('badge').className = 'status-badge status-up';
    document.getElementById('badge').textContent = t('session.badgeUp');
    updateTimerUI();
  }
}

// ═══════════════════════════════════════════════════════════
// End & Export
// ═══════════════════════════════════════════════════════════
function endSession() {
  state.sessionActive = false;
  clearInterval(state.sessionTimer);
  if (state.flipConfirmTimer) clearTimeout(state.flipConfirmTimer);
  if (state.motionHandler) window.removeEventListener('devicemotion', state.motionHandler);
  if (state.lightSensor) { try { state.lightSensor.stop(); } catch(e) {} }
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

  document.getElementById('session-actions').style.display = 'none';
  document.getElementById('session-done').style.display = 'block';
  state.badgeState = 'done';
  document.getElementById('badge').className = 'status-badge status-down';
  document.getElementById('badge').textContent = t('session.badgeDone');
  setNavVisible(true);
}

function earlyStop() {
  if (!confirm(t('confirm.earlyStop'))) return;
  endSession();
}

function exportData() {
  const prefix = [state.subject, state.condition].filter(Boolean).join('_') + '_' + Date.now();

  const meta = {
    participant: state.subject, condition: state.condition, repetition: state.repetition,
    date: new Date().toLocaleDateString(LANG === 'zh' ? 'zh-CN' : 'en-US'), duration_min: getSessionDuration(),
    flip_count: state.flipCount, total_face_down_sec: (state.totalFaceDownMs / 1000).toFixed(1),
    data_points: state.dataLog.length,
  };

  const bundle = {
    meta: meta,
    sensors: state.dataLog,
    flips: state.flipEvents,
  };

  const jsonStr = JSON.stringify(bundle, null, 2);
  const filename = prefix + '_bundle.json';

  // 方法1：Blob下载（桌面浏览器有效）
  let downloadOk = false;
  try {
    const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    downloadOk = true;
  } catch(e) {}

  // 方法2：textarea兜底（微信/手机浏览器Blob可能被拦，复制粘贴最可靠）
  var div = document.getElementById('export-fallback');
  if (!div) {
    div = document.createElement('div');
    div.id = 'export-fallback';
    div.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:var(--bg);padding:16px;overflow-y:auto';
    document.body.appendChild(div);
  }
  div.innerHTML =
    '<div style="max-width:480px;margin:0 auto">' +
    '<div class="title" style="font-size:24px;margin-bottom:8px">' + t('exp.title') + '</div>' +
    '<div class="subtitle" style="margin-bottom:12px">' + filename + '</div>' +
    (downloadOk ? '<div style="padding:10px;border-radius:10px;background:#E6F7ED;color:#157A3A;font-size:14px;margin-bottom:12px;text-align:center">' + t('exp.autoOk') + '</div>' : '<div style="padding:10px;border-radius:10px;background:#FFF3E0;color:#B85C00;font-size:14px;margin-bottom:12px;text-align:center">' + t('exp.autoFail') + '</div>') +
    '<div style="font-size:13px;color:var(--muted);margin-bottom:8px">' + t('exp.manual', {file: filename}) + '</div>' +
    '<textarea id="export-textarea" readonly style="width:100%;height:200px;padding:10px;border-radius:10px;border:1px solid var(--border);font-family:monospace;font-size:11px;background:var(--card);color:var(--text);resize:vertical;margin-bottom:12px"' + '>' + jsonStr.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/&/g,'&amp;').replace(/&amp;lt;/g,'&lt;').replace(/&amp;gt;/g,'&gt;') + '</textarea>' +
    '<button class="btn btn-primary" onclick="copyExport()" style="width:100%;margin-bottom:8px">' + t('exp.copyBtn') + '</button>' +
    '<button class="btn btn-ghost" onclick="document.getElementById(\'export-fallback\').style.display=\'none\'" style="width:100%;font-size:12px;color:var(--muted)">' + t('exp.close') + '</button>' +
    '</div>';
  div.style.display = 'block';

  saveToHistory(prefix, meta);
  showToast(t('toast.exported'), 'ok');
}

function copyExport() {
  var ta = document.getElementById('export-textarea');
  if (!ta) return;
  // 还原转义
  var raw = ta.value.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(raw).then(function(){
      showToast(t('toast.copied'), 'ok');
    }).catch(function(){
      ta.select(); document.execCommand('copy');
      showToast(t('toast.copiedShort'), 'ok');
    });
  } else {
    ta.select(); document.execCommand('copy');
    showToast(t('toast.copiedShort'), 'ok');
  }
}

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function resetToSetup() {
  showScreen('screen-setup');
}

// ═══════════════════════════════════════════════════════════
// History
// ═══════════════════════════════════════════════════════════
function saveToHistory(prefix, meta) {
  const h = JSON.parse(localStorage.getItem('flipfocus_history') || '[]');
  h.push({ prefix, meta, savedAt: new Date().toISOString() });
  localStorage.setItem('flipfocus_history', JSON.stringify(h));
}

function refreshDataList() {
  const h = JSON.parse(localStorage.getItem('flipfocus_history') || '[]').reverse();
  document.getElementById('data-count').textContent = t('data.count', {n: h.length});
  if (h.length === 0) {
    document.getElementById('data-list').innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px">' + t('data.empty') + '</p>';
    return;
  }
  document.getElementById('data-list').innerHTML = h.map((r, i) => `
    <div style="background:var(--card);border-radius:12px;padding:14px;margin-bottom:8px;border:1px solid var(--border)">
      <div style="font-weight:700;font-size:14px;margin-bottom:4px">${[r.meta.participant, r.meta.condition].filter(Boolean).join(' · ') || t('data.unnamed')}</div>
      <div style="font-size:12px;color:var(--muted)">${t('data.line', {date: r.meta.date, flips: r.meta.flip_count, points: r.meta.data_points})}</div>
      <button onclick="deleteHistoryItem(${h.length-1-i})" style="margin-top:6px;padding:4px 10px;border-radius:6px;border:1px solid var(--red);background:transparent;color:var(--red);font-size:11px;cursor:pointer">${t('data.delete')}</button>
    </div>
  `).join('');
}

function deleteHistoryItem(idx) {
  if (!confirm(t('confirm.delete'))) return;
  const h = JSON.parse(localStorage.getItem('flipfocus_history') || '[]');
  h.splice(idx, 1);
  localStorage.setItem('flipfocus_history', JSON.stringify(h));
  refreshDataList();
}

function exportAll() {
  const h = JSON.parse(localStorage.getItem('flipfocus_history') || '[]');
  if (h.length === 0) { showToast(t('toast.noData'), 'warn'); return; }
  downloadFile('flipfocus_all_meta_' + Date.now() + '.json', JSON.stringify(h.map(r => r.meta), null, 2), 'application/json');
  showToast(t('toast.metaExported'), 'ok');
}

// ═══════════════════════════════════════════════════════════
// Helpers
// ═══════════════════════════════════════════════════════════
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast ' + (type || 'ok'); el.style.display = 'block';
  clearTimeout(el._timeout);
  el._timeout = setTimeout(() => { el.style.display = 'none'; }, 2500);
}

// ═══════════════════════════════════════════════════════════
// Language
// ═══════════════════════════════════════════════════════════
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t('doc.title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.getElementById('langBtn').textContent = LANG === 'zh' ? 'EN' : '中文';

  refreshDynamicUI();
  if (document.getElementById('screen-data').classList.contains('active')) refreshDataList();
}

// 按当前状态重刷动态文字（切语言时用）
function refreshDynamicUI() {
  toggleDebug();
  const badge = document.getElementById('badge');
  if (badge) badge.textContent = t({up:'session.badgeUp', down:'session.badgeDown', done:'session.badgeDone'}[state.badgeState]);
  const faceEl = document.getElementById('s-face');
  if (faceEl) faceEl.textContent = state.faceDownNow ? t('yes') : t('no');
  const lightEl = document.getElementById('s-light');
  if (lightEl) {
    if (state.lightState === 'unavailable') lightEl.textContent = t('lightUnavailable');
    else if (typeof state.lightState === 'number') lightEl.textContent = Math.round(state.lightState) + ' lux';
  }
  if (state.lightState !== null) updateSensorModeUI();
}

function toggleLang() {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('flipfocus_lang', LANG);
  applyLang();
}

// ═══════════════════════════════════════════════════════════
// Boot
// ═══════════════════════════════════════════════════════════
(function() {
  // 检查是否有未恢复的autosave数据
  var saved = localStorage.getItem('flipfocus_autosave');
  if (saved) {
    try {
      var backup = JSON.parse(saved);
      if (backup.sensors && backup.sensors.length > 0) {
        var mins = Math.floor(backup.elapsed / 60);
        var secs = backup.elapsed % 60;
        if (confirm(t('boot.found', {
              subj: backup.participant || t('data.unnamed'),
              min: mins, sec: secs, n: backup.sensors.length
            }))) {
          state.subject = backup.participant;
          state.condition = backup.condition;
          state.repetition = backup.repetition;
          state.elapsed = backup.elapsed;
          state.flipCount = backup.flipCount;
          state.totalFaceDownMs = backup.totalFaceDownMs;
          state.dataLog = backup.sensors;
          state.flipEvents = backup.flips;
          exportData();
          localStorage.removeItem('flipfocus_autosave');
        }
      }
    } catch(e) {}
  }
  applyLang();
  if (typeof DeviceMotionEvent === 'undefined') {
    permGranted = true;
    initSetupScreen();
    showScreen('screen-guide');
  } else if (typeof DeviceMotionEvent.requestPermission !== 'function') {
    permGranted = true;
    initSetupScreen();
    showScreen('screen-guide');
  }
  // iOS 13+ stays on permission screen
})();
</script>
